<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#346340" />
      <stop offset="100%" stop-color="#193622" />
    </radialGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#E58A24" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E58A24" />
      <stop offset="50%" stop-color="#FFA834" />
      <stop offset="100%" stop-color="#FFF8EC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Pebble / Rounded Shield in Deep Leaf Green -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGlow)" stroke="#E58A24" stroke-width="12" />

  <!-- Traditional Earthen Handi (मडके / हांडी) & Authentic Chulha Flame -->
  <g filter="url(#shadow)">
    <!-- Woodfire Flame Rising from Bharit Handi -->
    <path d="M256 80 C268 120 236 145 236 170 C236 195 256 215 256 215 C256 215 276 195 276 170 C276 145 244 120 256 80 Z" fill="url(#flameGrad)" />
    <path d="M256 125 C262 145 248 160 248 175 C248 190 256 200 256 200 C256 200 264 190 264 175 C264 160 250 145 256 125 Z" fill="#FFF8EC" />

    <!-- Upper Rim of Handi -->
    <ellipse cx="256" cy="225" rx="130" ry="32" fill="#E58A24" stroke="#FFF8EC" stroke-width="6" />
    
    <!-- Inner Bowl Depth -->
    <ellipse cx="256" cy="225" rx="110" ry="22" fill="#142B1B" />

    <!-- Authentic Bharit Filling Surface with Garnish Accent -->
    <ellipse cx="256" cy="227" rx="105" ry="18" fill="#3F7548" opacity="0.9" />
    <circle cx="240" cy="226" r="6" fill="#FFA834" />
    <circle cx="270" cy="228" r="5" fill="#FFA834" />
    <circle cx="255" cy="224" r="4" fill="#FFF8EC" />

    <!-- Handi Body (Classic Round Earthen Pot) -->
    <path d="M136 235 C130 330 180 405 256 405 C332 405 382 330 376 235 C350 255 162 255 136 235 Z" fill="url(#saffronGrad)" stroke="#193622" stroke-width="8" />

    <!-- Traditional Decorative Neck Band -->
    <path d="M152 265 Q256 288 360 265" fill="none" stroke="#FFF8EC" stroke-width="8" stroke-linecap="round" />
    <path d="M168 285 Q256 308 344 285" fill="none" stroke="#193622" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round" />

    <!-- Pot Base Accent Ring -->
    <ellipse cx="256" cy="385" rx="60" ry="14" fill="#142B1B" opacity="0.6" />
  </g>

  <!-- Pure Veg Green Dot Badge in Bottom Right -->
  <g transform="translate(372, 372)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#3F7548" stroke-width="6" />
    <circle cx="40" cy="40" r="22" fill="#3F7548" />
  </g>
</svg>
